<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChaacImpact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  </style>
</head>

<body class="text-white bg-black overflow-x-hidden">

  <!-- NAVBAR (fija, grande) -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-black/35 backdrop-blur-md">
    <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 lg:px-8 py-2">
      <!-- Logo + nombre -->
      <div class="flex items-center gap-4">
        <img src="/assets/Logo.png" alt="ChaacImpact" class="ml-2 w-20 h-20 select-none" />
      </div>
      <!-- Links -->
      <ul class="hidden md:flex items-center gap-16">
        <li><a href="#inicio" class="mr-14 text-lg lg:text-xl font-semibold hover:text-violet-300">Inicio</a></li>
        <li><a href="#asteroides" class="mr-9 text-lg lg:text-xl font-semibold hover:text-violet-300">Seleccionar Asteroide</a></li>
        <li><a href="#proyecto" class="mr-8 text-lg lg:text-xl font-semibold hover:text-violet-300">GameMode</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO / SECCIÓN SUPERIOR (espacio) -->
<section id="inicio"
         class="relative min-h-[100svh] flex items-center"
         style="background-image:url('/assets/fondo.jpeg')">
  <div class="absolute inset-0 bg-cover bg-center" style="background-image:url('fondo.png')"></div>
  <div class="absolute inset-0 bg-black/35"></div>

  <!-- CONTENIDO: envolvente con ancho del texto para que el botón pueda centrarse respecto al título -->
  <div class="relative z-10 w-full max-w-7xl mx-auto px-6 lg:px-8 pt-[96px] pb-16">
    <!-- bloque de texto con ancho ajustado al contenido -->
    <div class="inline-flex flex-col items-start">
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight">
        ChaacImpact
      </h1>

      <!-- ↓ más separación bajo el título -->
      <p class="mt-6 text-lg md:text-xl font-semibold self-center text-center max-w-[42rem] w-full">
        Simula el impacto y salva el futuro
      </p>
      <!-- ↓ el botón se centra con respecto al bloque del título -->
      <a href="#proyecto"
         class="self-center mt-8 rounded-full px-8 py-3 text-base md:text-lg font-extrabold
                bg-white/10 hover:bg-white/20 transition
                shadow-[0_10px_30px_rgba(0,0,0,0.35)]">
        Comenzar
      </a>
    </div>
  </div>

  <!-- ELEMENTOS DECORATIVOS (ESTÁTICOS) -->

  <img src="/assets/asteroide.png" alt="" aria-hidden="true"
       class="pointer-events-none select-none absolute z-[5]
              w-[200px] md:w-[190px] lg:w-[250px]
              top-[190px] md:top-[210px] lg:top-[220px]
              right-[28%] md:right-[30%] lg:right-[32%]" />


  <img src="/assets/tierra.png" alt="" aria-hidden="true"
       class="pointer-events-none select-none absolute z-[4]
              w-[340px] md:w-[440px] lg:w-[560px]
              -bottom-[120px] md:-bottom-[160px] lg:-bottom-[180px]
              -right-[80px] md:-right-[110px] lg:-right-[140px]" />
</section>

    <!-- ====== SECCIÓN INFERIOR (estrellas) ====== -->
    <section
      id="asteroides"
      class="relative min-h-screen flex flex-col justify-center items-center text-center px-4 bg-cover bg-center"
      style="background-image: url('/assets/fondo.jpeg')"
    >
      <div class="absolute inset-0 bg-gradient-to-b"></div>
      <div class="relative z-10 flex flex-col md:flex-row gap-10">
        <!-- Real -->
        <div class="bg-purple-900/40 rounded-2xl p-6 w-64 hover:scale-105 transition">
          <h3 class="text-lg font-bold mb-4">Real</h3>
          <img src="/assets/real.png" alt="Asteroide real" class="mx-auto w-64 mb-4 text"/>
          <button class="bg-purple-700 hover:bg-purple-600 px-4 py-2 rounded-md font-semibold text-sm">
            <a href="miti_impact.html">Seleccionar</a>
          </button>
        </div>

        <!-- Crea el tuyo -->
        <div class="bg-blue-900/40 rounded-2xl p-6 w-64 hover:scale-105 transition">
          <h3 class="text-lg font-bold mb-4">Crea el tuyo</h3>
          <img src="/assets/silueta.png" alt="Asteroide personalizado" class="mx-auto w-64 mb-4" />
          <button class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-md font-semibold text-sm">
            <a href="miti_impact.html">Seleccionar</a>
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
