<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Mitigación de Asteroides</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2a2a2a;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: #3a3a3a;
            border-radius: 8px;
            border: 1px solid #4a4a4a;
        }

        h1 {
            font-size: 2.2em;
            color: #d0d0d0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1em;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .section {
            background: #3a3a3a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #4a4a4a;
        }

        .visualization-frame {
            background: #2f2f2f;
            border-radius: 8px;
            padding: 30px;
            border: 2px solid #4a4a4a;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #707070;
            font-size: 1.1em;
        }

        h2 {
            color: #c0c0c0;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 1px solid #4a4a4a;
            padding-bottom: 10px;
        }

        .asteroid-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .asteroid-card {
            background: #333333;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .asteroid-card:hover {
            background: #3d3d3d;
        }

        .asteroid-card.selected {
            background: #4a4a4a;
            border-color: #606060;
        }

        .asteroid-name {
            font-size: 1.1em;
            color: #d0d0d0;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .asteroid-info {
            color: #b0b0b0;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .asteroid-details {
            background: #333333;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .asteroid-details.active {
            display: block;
        }

        .asteroid-details h3 {
            color: #c0c0c0;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .detail-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-item {
            background: #2f2f2f;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .detail-label {
            color: #a0a0a0;
            font-weight: bold;
        }

        .detail-value {
            color: #d0d0d0;
            margin-left: 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            color: #b0b0b0;
            margin-bottom: 6px;
            display: block;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            background: #2f2f2f;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 10px;
            color: #e0e0e0;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #606060;
        }

        .calculate-btn {
            width: 100%;
            background: #505050;
            border: 1px solid #606060;
            border-radius: 6px;
            padding: 12px;
            color: #e0e0e0;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            background: #5a5a5a;
        }

        .calculate-btn:active {
            background: #4a4a4a;
        }

        .results-section {
            background: #3a3a3a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #4a4a4a;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .strategy-card {
            background: #333333;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            padding: 18px;
        }

        .strategy-title {
            font-size: 1.2em;
            color: #d0d0d0;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .formula {
            background: #2a2a2a;
            border-left: 3px solid #606060;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #b0b0b0;
        }

        .result-item {
            margin: 8px 0;
            padding: 8px;
            background: #2f2f2f;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .result-label {
            color: #a0a0a0;
            font-weight: bold;
        }

        .result-value {
            color: #d0d0d0;
            margin-left: 10px;
        }

        h4 {
            color: #b0b0b0;
            margin: 15px 0 10px 0;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora de Mitigación de Asteroides</h1>
            <p class="subtitle">Sistema de Análisis de Deflexión Planetaria</p>
        </header>

        <div class="main-layout">
            <!-- Columna izquierda: Selección de asteroide -->
            <div class="section">
                <h2>Selección de Asteroide</h2>
                <div class="asteroid-list" id="asteroidList"></div>
                <div class="asteroid-details" id="asteroidDetails"></div>
            </div>

            <!-- Columna central: Frame para visualización -->
            <div class="visualization-frame" id="visualizationFrame">
                [Espacio reservado para visualización]
            </div>

            <!-- Columna derecha: Parámetros -->
            <div class="section">
                <h2>Parámetros de Misión</h2>
                <div class="input-group">
                    <label for="warningTime">Tiempo de Advertencia (años)</label>
                    <input type="number" id="warningTime" value="10" min="1" max="50" step="0.1">
                </div>
                <div class="input-group">
                    <label for="distance">Distancia al Impacto (UA)</label>
                    <input type="number" id="distance" value="1.5" min="0.1" max="5" step="0.1">
                </div>
                <button class="calculate-btn" onclick="calculateAllStrategies()">
                    Calcular Estrategias
                </button>
            </div>
        </div>

        <!-- Sección de resultados debajo -->
        <div class="results-section">
            <h2>Estrategias de Mitigación</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script>
        // Dataset de asteroides
        const asteroids = [
            {
                id: 1,
                name: "433 Eros",
                diameter: 16700,
                velocity: 24450,
                mass: 6.687e15,
                density: 2670
            },
            {
                id: 2,
                name: "99942 Apophis",
                diameter: 370,
                velocity: 30730,
                mass: 2.7e10,
                density: 3200
            },
            {
                id: 3,
                name: "101955 Bennu",
                diameter: 490,
                velocity: 28000,
                mass: 7.329e10,
                density: 1190
            }
        ];

        let selectedAsteroid = null;

        function init() {
            displayAsteroids();
        }

        function displayAsteroids() {
            const list = document.getElementById('asteroidList');
            list.innerHTML = '';
            
            asteroids.forEach(asteroid => {
                const card = document.createElement('div');
                card.className = 'asteroid-card';
                card.onclick = () => selectAsteroid(asteroid, card);
                card.innerHTML = `
                    <div class="asteroid-name">${asteroid.name}</div>
                    <div class="asteroid-info">
                        Diámetro: ${asteroid.diameter.toLocaleString()} m<br>
                        Velocidad: ${asteroid.velocity.toLocaleString()} m/s<br>
                        Masa: ${asteroid.mass.toExponential(2)} kg
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function selectAsteroid(asteroid, cardElement) {
            selectedAsteroid = asteroid;
            
            document.querySelectorAll('.asteroid-card').forEach(card => {
                card.classList.remove('selected');
            });
            cardElement.classList.add('selected');
            
            const details = document.getElementById('asteroidDetails');
            details.className = 'asteroid-details active';
            details.innerHTML = `
                <h3>Información Detallada</h3>
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Nombre:</span>
                        <span class="detail-value">${asteroid.name}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Diámetro:</span>
                        <span class="detail-value">${asteroid.diameter.toLocaleString()} m</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Velocidad:</span>
                        <span class="detail-value">${asteroid.velocity.toLocaleString()} m/s</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Masa:</span>
                        <span class="detail-value">${asteroid.mass.toExponential(3)} kg</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Densidad:</span>
                        <span class="detail-value">${asteroid.density.toLocaleString()} kg/m³</span>
                    </div>
                </div>
            `;
        }

        function calculateKineticImpact(asteroid, warningTime, distance) {
            const impactorMass = 500;
            const impactorVelocity = 10000;
            const beta = 1.9;
            
            const deltaV = (beta * impactorMass * impactorVelocity) / asteroid.mass;
            const timeSeconds = warningTime * 365.25 * 24 * 3600;
            const deviation = deltaV * timeSeconds;
            const earthRadii = deviation / 6371000;
            
            return {
                method: "Impacto Cinético",
                formula: "Δv = (β × m_impactor × v_impactor) / m_asteroid",
                parameters: {
                    "Masa impactor": `${impactorMass} kg`,
                    "Velocidad impactor": `${impactorVelocity.toLocaleString()} m/s`,
                    "Factor β": beta,
                    "Masa asteroide": `${asteroid.mass.toExponential(2)} kg`
                },
                deltaV: deltaV,
                deviation: deviation,
                earthRadii: earthRadii
            };
        }

        function calculateGravitationalTractor(asteroid, warningTime, distance) {
            const spacecraftMass = 20000;
            const operationDistance = 100;
            const G = 6.674e-11;
            
            const force = (G * spacecraftMass * asteroid.mass) / (operationDistance * operationDistance);
            const acceleration = force / asteroid.mass;
            const timeSeconds = warningTime * 365.25 * 24 * 3600;
            const deltaV = acceleration * timeSeconds;
            const deviation = deltaV * timeSeconds;
            const earthRadii = deviation / 6371000;
            
            return {
                method: "Tractor Gravitacional",
                formula: "F = G × m_nave × m_asteroid / r²; Δv = (F/m) × t",
                parameters: {
                    "Masa nave": `${spacecraftMass.toLocaleString()} kg`,
                    "Distancia operación": `${operationDistance} m`,
                    "Constante G": `${G.toExponential(3)}`,
                    "Tiempo": `${warningTime} años`
                },
                deltaV: deltaV,
                deviation: deviation,
                earthRadii: earthRadii
            };
        }

        function calculateLaserAblation(asteroid, warningTime, distance) {
            const laserPower = 1e6;
            const efficiency = 0.1;
            const ablationVelocity = 1000;
            
            const massFlowRate = (laserPower * efficiency) / (0.5 * ablationVelocity * ablationVelocity);
            const timeSeconds = warningTime * 365.25 * 24 * 3600;
            const deltaV = (massFlowRate * ablationVelocity * timeSeconds) / asteroid.mass;
            const deviation = deltaV * timeSeconds;
            const earthRadii = deviation / 6371000;
            
            return {
                method: "Ablación Láser",
                formula: "Δv = (ṁ × v_ablation × t) / m_asteroid",
                parameters: {
                    "Potencia láser": `${(laserPower/1e6).toFixed(1)} MW`,
                    "Eficiencia": `${(efficiency*100)}%`,
                    "Velocidad ablación": `${ablationVelocity} m/s`,
                    "Flujo de masa": `${massFlowRate.toExponential(2)} kg/s`
                },
                deltaV: deltaV,
                deviation: deviation,
                earthRadii: earthRadii
            };
        }

        function calculateNuclearExplosion(asteroid, warningTime, distance) {
            const yieldMegatons = 1;
            const yieldJoules = yieldMegatons * 4.184e15;
            const efficiency = 0.05;
            const standoffDistance = asteroid.diameter;
            
            const energyTransferred = yieldJoules * efficiency;
            const deltaV = Math.sqrt((2 * energyTransferred) / asteroid.mass);
            const timeSeconds = warningTime * 365.25 * 24 * 3600;
            const deviation = deltaV * timeSeconds;
            const earthRadii = deviation / 6371000;
            
            return {
                method: "Explosión Nuclear",
                formula: "Δv = √(2 × E_transferred / m_asteroid)",
                parameters: {
                    "Rendimiento": `${yieldMegatons} Megaton`,
                    "Energía total": `${yieldJoules.toExponential(2)} J`,
                    "Eficiencia": `${(efficiency*100)}%`,
                    "Distancia detonación": `${standoffDistance.toLocaleString()} m`
                },
                deltaV: deltaV,
                deviation: deviation,
                earthRadii: earthRadii
            };
        }

        function calculateAllStrategies() {
            if (!selectedAsteroid) {
                alert('Por favor selecciona un asteroide primero');
                return;
            }

            const warningTime = parseFloat(document.getElementById('warningTime').value);
            const distance = parseFloat(document.getElementById('distance').value);

            const results = [
                calculateKineticImpact(selectedAsteroid, warningTime, distance),
                calculateGravitationalTractor(selectedAsteroid, warningTime, distance),
                calculateLaserAblation(selectedAsteroid, warningTime, distance),
                calculateNuclearExplosion(selectedAsteroid, warningTime, distance)
            ];

            displayResults(results);
        }

        function displayResults(results) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'strategy-card';
                
                let paramsHTML = '';
                for (const [key, value] of Object.entries(result.parameters)) {
                    paramsHTML += `
                        <div class="result-item">
                            <span class="result-label">${key}:</span>
                            <span class="result-value">${value}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="strategy-title">${result.method}</div>
                    <div class="formula">${result.formula}</div>
                    <h4>Parámetros:</h4>
                    ${paramsHTML}
                    <h4>Resultados:</h4>
                    <div class="result-item">
                        <span class="result-label">Δv:</span>
                        <span class="result-value">${result.deltaV.toExponential(3)} m/s</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Desviación total:</span>
                        <span class="result-value">${result.deviation.toExponential(3)} m</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Radios terrestres:</span>
                        <span class="result-value">${result.earthRadii.toFixed(2)} R⊕</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
