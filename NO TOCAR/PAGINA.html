<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ChaacImpact - Simulador de Impactos Reales NASA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family:Segoe UI, Arial, sans-serif; background:#fff; }
  #map { position:absolute; top:0; bottom:0; right:0; left:0; }
  #panel {
    position:absolute; bottom:10px; left:15px; z-index:1000;
    background:rgba(255,255,255,0.97); padding:15px; border-radius:12px;
    width:360px; box-shadow:0 0 14px rgba(0,0,0,0.25); max-height:90vh; overflow-y:auto;
  }
  h1 { margin:0 0 4px; font-size:20px; color:#004a7c; text-align:center; }
  p.desc { margin-top:0; font-size:13px; color:#004a7c; text-align:center; }
  .tab-container { display:flex; gap:5px; margin-bottom:10px; }
  .tab { flex:1; padding:8px; background:#e0e0e0; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
  .tab.active { background:#0080ff; color:white; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  label { display:block; margin-top:8px; font-weight:600; color:#003355; font-size:13px; }
  input[type=text], input[type=range], select, button {
    width:100%; padding:7px; margin-top:5px;
    border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box;
  }
  input[type=range] {
    appearance:none; height:6px; border-radius:3px; background:#cfd8dc; outline:none; padding:0;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance:none; width:15px; height:15px; border-radius:50%;
    background:#0080ff; cursor:pointer;
  }
  button {
    background:#0080ff; color:white; font-weight:bold; cursor:pointer;
    border:none; border-radius:8px; padding:10px;
  }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  button.secondary { background:#666; margin-top:5px; padding:6px; font-size:13px; }
  .val { float:right; color:#004a7c; font-weight:bold; font-size:13px; }
  pre {
    background:#f3f8ff; padding:8px; border-radius:6px;
    font-size:12px; color:#002b55; margin-top:10px; white-space:pre-wrap;
    max-height:200px; overflow-y:auto; line-height:1.4;
  }
  .asteroid-list { max-height:150px; overflow-y:auto; margin-top:5px; }
  .asteroid-item {
    padding:8px; background:#f5f5f5; margin:3px 0; border-radius:5px; cursor:pointer;
    font-size:13px; border:2px solid transparent;
  }
  .asteroid-item:hover { background:#e3f2fd; }
  .asteroid-item.selected { border-color:#0080ff; background:#e3f2fd; }
  .asteroid-item.dangerous { border-left:3px solid #ff3300; }
  .loading { text-align:center; padding:20px; color:#666; }
  .error { background:#ffebee; color:#c62828; padding:10px; border-radius:6px; margin-top:10px; font-size:13px; }
  .info-badge { 
    display:inline-block; padding:2px 6px; border-radius:4px; font-size:11px; 
    margin-left:5px; font-weight:bold;
  }
  .badge-danger { background:#ff3300; color:white; }
  .badge-safe { background:#4caf50; color:white; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>ChaacImpact</h1>
  <p class="desc">Simulador de impactos con asteroides reales de NASA</p>

  <div class="tab-container">
    <button class="tab active" onclick="switchTab('real')">Asteroides Reales</button>
    <button class="tab" onclick="switchTab('custom')">Personalizado</button>
  </div>

  <div id="real-tab" class="tab-content active">
    <label>Buscar asteroide NASA</label>
    <input type="text" id="searchInput" placeholder="Nombre o ID (ej: 433, Apophis)">
    <button onclick="buscarAsteroide()">Buscar</button>
    <button class="secondary" onclick="listarPeligrosos()">Listar asteroides conocidos</button>

    <div id="searchResults"></div>
    <div id="asteroidInfo"></div>

    <div id="realParams" style="display:none;">
      <label>Velocidad de impacto (km/s) <span class="val" id="realVelVal">25</span></label>
      <input type="range" id="realVel" min="10" max="100" value="25">

      <label>Ángulo de impacto (grados) <span class="val" id="realAngVal">45</span></label>
      <input type="range" id="realAng" min="15" max="75" value="45">

      <label>Densidad poblacional (personas/km²) <span class="val" id="realPopVal">300</span></label>
      <input type="range" id="realPop" min="0" max="10000" value="300">

      <p style="font-size:13px; margin-top:10px;">Haz clic en el mapa para seleccionar el punto de impacto.</p>
      <button id="simulateReal" disabled>Simular impacto real</button>
    </div>
  </div>

  <div id="custom-tab" class="tab-content">
    <label>Tipo de asteroide</label>
    <select id="type">
      <option value="3000">Condrita ordinaria - 3000 kg/m³</option>
      <option value="7800">Hierro - 7800 kg/m³</option>
      <option value="2200">Condrita carbonácea - 2200 kg/m³</option>
      <option value="4500">Pallasita - 4500 kg/m³</option>
      <option value="600">Cometario - 600 kg/m³</option>
    </select>

    <label>Diámetro (m) <span class="val" id="diamVal">50</span></label>
    <input type="range" id="diam" min="1" max="10000" value="50">

    <label>Velocidad (km/s) <span class="val" id="velVal">25</span></label>
    <input type="range" id="vel" min="10" max="100" value="25">

    <label>Ángulo (grados) <span class="val" id="angVal">45</span></label>
    <input type="range" id="ang" min="15" max="75" value="45">

    <label>Densidad poblacional (personas/km²) <span class="val" id="popVal">300</span></label>
    <input type="range" id="popDensity" min="0" max="10000" value="300">

    <p style="font-size:13px; margin-top:10px;">Haz clic en el mapa para seleccionar el punto de impacto.</p>
    <button id="simulateCustom" disabled>Simular impacto personalizado</button>
  </div>

  <pre id="results">Esperando selección...</pre>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const API_BASE = 'http://localhost:5000/api';
const map = L.map('map', {minZoom:2, maxZoom:7, worldCopyJump:false}).setView([20,0],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap'
}).addTo(map);

let impactMarker = null, impactLatLng = null;
let selectedAsteroid = null;
const results = document.getElementById('results');

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tab + '-tab').classList.add('active');
}

// Map click handler
map.on('click', e => {
  if(impactMarker) map.removeLayer(impactMarker);
  impactLatLng = e.latlng;
  impactMarker = L.marker(e.latlng).addTo(map).bindPopup("Punto de impacto").openPopup();
  document.getElementById('simulateReal').disabled = !selectedAsteroid;
  document.getElementById('simulateCustom').disabled = false;
});

// Buscar asteroide
async function buscarAsteroide() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;

  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '<div class="loading">Buscando...</div>';

  try {
    const resp = await fetch(`${API_BASE}/buscar/${encodeURIComponent(query)}`);
    const data = await resp.json();

    if (data.success) {
      mostrarAsteroide(data.data_completa);
    } else {
      resultsDiv.innerHTML = `<div class="error">${data.error}</div>`;
    }
  } catch (error) {
    resultsDiv.innerHTML = `<div class="error">Error de conexión: ${error.message}</div>`;
  }
}

// Listar asteroides peligrosos
async function listarPeligrosos() {
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '<div class="loading">Cargando asteroides...</div>';

  try {
    const resp = await fetch(`${API_BASE}/lista`);
    const data = await resp.json();

    if (data.success) {
      let html = '<div class="asteroid-list">';
      data.asteroides.forEach(ast => {
        const dangerClass = ast.peligroso ? 'dangerous' : '';
        const badge = ast.peligroso 
          ? '<span class="info-badge badge-danger">PELIGROSO</span>' 
          : '<span class="info-badge badge-safe">SEGURO</span>';
        html += `
          <div class="asteroid-item ${dangerClass}" onclick="seleccionarAsteroide('${ast.id}')">
            <strong>${ast.name}</strong> ${badge}<br>
            <small>Diámetro: ${ast.diametro_min}-${ast.diametro_max} m</small>
          </div>
        `;
      });
      html += '</div>';
      resultsDiv.innerHTML = html;
    }
  } catch (error) {
    resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
  }
}

// Seleccionar asteroide de la lista
async function seleccionarAsteroide(id) {
  try {
    const resp = await fetch(`${API_BASE}/buscar/${id}`);
    const data = await resp.json();
    if (data.success) {
      mostrarAsteroide(data.data_completa);
      document.querySelectorAll('.asteroid-item').forEach(item => {
        item.classList.remove('selected');
      });
      event.target.closest('.asteroid-item').classList.add('selected');
    }
  } catch (error) {
    console.error(error);
  }
}

// Mostrar información del asteroide
function mostrarAsteroide(neo) {
  selectedAsteroid = neo;
  const diam = neo.estimated_diameter.meters;
  const infoDiv = document.getElementById('asteroidInfo');
  
  const badge = neo.is_potentially_hazardous_asteroid 
    ? '<span class="info-badge badge-danger">PELIGROSO</span>' 
    : '<span class="info-badge badge-safe">SEGURO</span>';

  infoDiv.innerHTML = `
    <div style="background:#e8f5e9; padding:10px; border-radius:6px; margin-top:10px; font-size:13px;">
      <strong>${neo.name}</strong> ${badge}<br>
      ID: ${neo.neo_reference_id}<br>
      Diámetro: ${diam.estimated_diameter_min.toFixed(1)}-${diam.estimated_diameter_max.toFixed(1)} m
    </div>
  `;
  
  document.getElementById('realParams').style.display = 'block';
  document.getElementById('searchResults').innerHTML = '';
  
  if (impactLatLng) {
    document.getElementById('simulateReal').disabled = false;
  }
}

// Simular impacto real
document.getElementById('simulateReal').onclick = async () => {
  if (!selectedAsteroid || !impactLatLng) return;

  results.textContent = 'Calculando impacto...';

  try {
    const resp = await fetch(`${API_BASE}/simular`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        asteroide_id: selectedAsteroid.neo_reference_id,
        velocidad: parseFloat(document.getElementById('realVel').value),
        angulo: parseFloat(document.getElementById('realAng').value)
      })
    });

    const data = await resp.json();
    
    if (data.success) {
      const r = data.resultado;
      mostrarResultados(r);
      animarImpacto(
        impactLatLng, 
        r.caracteristicas.diametro,
        r.caracteristicas.angulo,
        r.efectos.radio_dano_km,
        r.crater.diametro,
        parseFloat(document.getElementById('realPop').value)
      );
    } else {
      results.textContent = 'Error: ' + data.error;
    }
  } catch (error) {
    results.textContent = 'Error de conexión: ' + error.message;
  }
};

// Simular impacto personalizado
document.getElementById('simulateCustom').onclick = () => {
  if (!impactLatLng) return;

  const d = parseFloat(document.getElementById('diam').value);
  const v = parseFloat(document.getElementById('vel').value);
  const a = parseFloat(document.getElementById('ang').value);
  const rho = parseFloat(document.getElementById('type').value);
  const pd = parseFloat(document.getElementById('popDensity').value);

  const volumen = Math.PI/6 * Math.pow(d, 3);
  const masa = volumen * rho;
  const energia = 0.5 * masa * Math.pow(v*1000, 2) * Math.sin(a*Math.PI/180);
  const megatones = energia / 4.184e15;
  
  const factor_densidad = Math.pow(rho/2500, 1/3);
  const factor_velocidad = Math.pow(v*1000/12000, 0.44);
  const factor_angulo = Math.pow(Math.sin(a*Math.PI/180), 1/3);
  const crater_m = 1.8 * d * factor_densidad * factor_velocidad * factor_angulo;
  
  const blast_km = 2.2 * Math.pow(megatones*1000, 0.33);

  const resultado = {
    caracteristicas: {diametro:d, masa:masa, velocidad:v, angulo:a, densidad:rho},
    energia: {megatones:megatones, total_joules:energia},
    crater: {diametro:crater_m, diametro_km:crater_m/1000},
    efectos: {radio_dano_km:blast_km, area_afectada_km2:Math.PI*blast_km*blast_km}
  };

  mostrarResultados(resultado);
  animarImpacto(impactLatLng, d, a, blast_km, crater_m, pd);
};

function mostrarResultados(r) {
  results.textContent = `
RESULTADOS DEL IMPACTO

CARACTERÍSTICAS:
• Diámetro: ${r.caracteristicas.diametro.toFixed(2)} m
• Masa: ${r.caracteristicas.masa.toExponential(2)} kg
• Velocidad: ${r.caracteristicas.velocidad.toFixed(1)} km/s
• Densidad: ${r.caracteristicas.densidad} kg/m³

ENERGÍA:
• Total: ${r.energia.total_joules.toExponential(2)} J
• Equivalente: ${r.energia.megatones.toFixed(2)} megatones TNT

CRÁTER:
• Diámetro: ${r.crater.diametro_km.toFixed(2)} km
• Radio: ${(r.crater.diametro_km/2).toFixed(2)} km

EFECTOS:
• Radio de daño: ${r.efectos.radio_dano_km.toFixed(2)} km
• Área afectada: ${r.efectos.area_afectada_km2.toFixed(2)} km²
${r.efectos.magnitud_richter ? '• Magnitud sísmica: ' + r.efectos.magnitud_richter + ' Richter' : ''}

${r.peligro ? 'EVALUACIÓN: ' + r.peligro : ''}
  `;
}

function animarImpacto(target, d, a, blast_km, crater_m, popDensity) {
  if (window._layers) window._layers.forEach(l => map.removeLayer(l));
  window._layers = [];

  const startLat = target.lat + 15 * Math.cos(a*Math.PI/180);
  const startLng = target.lng - 15 * Math.sin(a*Math.PI/180);
  const meteorRadius = Math.min(25, Math.max(8, d/400));
  const meteorColor = d<100 ? '#ff9933' : d<1000 ? '#ff3300' : '#ffffcc';

  const meteor = L.circleMarker([startLat, startLng], {
    radius:meteorRadius, color:meteorColor, fillColor:meteorColor, fillOpacity:0.9
  }).addTo(map);
  window._layers.push(meteor);

  let step=0, steps=220;
  const interval = setInterval(() => {
    const lat = startLat + (target.lat-startLat)*step/steps;
    const lng = startLng + (target.lng-startLng)*step/steps;
    meteor.setLatLng([lat, lng]);

    if (step%5===0) {
      const flame = L.circleMarker([lat,lng], {radius:2, color:'orange', fillColor:'red', fillOpacity:0.6}).addTo(map);
      window._layers.push(flame);
      setTimeout(() => map.removeLayer(flame), 400);
    }

    if (step >= steps) {
      clearInterval(interval);
      map.removeLayer(meteor);
      dibujarImpacto(target, crater_m, blast_km);
    }
    step++;
  }, 22);
}

function dibujarImpacto(latlng, crater_m, blast_km) {
  const crater = L.circle(latlng, {radius:crater_m/2, color:'#222', fillColor:'#111', fillOpacity:0.8}).addTo(map);
  window._layers.push(crater);

  const heat = L.circle(latlng, {radius:blast_km*600, color:'#ff3300', fillColor:'#ff9933', fillOpacity:0.25}).addTo(map);
  window._layers.push(heat);

  const shock = L.circle(latlng, {radius:blast_km*800, color:'#0066ff', fillColor:'#99ccff', fillOpacity:0.2}).addTo(map);
  window._layers.push(shock);

  const seismic = L.circle(latlng, {radius:blast_km*1200, color:'#999', fillColor:'#ccc', fillOpacity:0.15}).addTo(map);
  window._layers.push(seismic);

  const smoke = L.circle(latlng, {radius:crater_m*2, color:'#555', fillColor:'#333', fillOpacity:0.5}).addTo(map);
  window._layers.push(smoke);
  setTimeout(() => map.removeLayer(smoke), 4000);
}

// Range input handlers
['diam','vel','ang','popDensity','realVel','realAng','realPop'].forEach(id => {
  const el = document.getElementById(id);
  if (el) {
    const val = document.getElementById(id+'Val');
    if (val) el.addEventListener('input', () => val.textContent = el.value);
  }
});

// Enter key para buscar
document.getElementById('searchInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') buscarAsteroide();
});
</script>
</body>
</html>
