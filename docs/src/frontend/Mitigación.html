<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Mitigación de Asteroides</title>
    <link rel="stylesheet" href="/css/Mitigación.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora de Mitigación de Asteroides</h1>
            <p class="subtitle">Sistema de Análisis de Deflexión Planetaria</p>
        </header>

        <div class="main-layout">
            <!-- Columna izquierda: Selección de asteroide -->
            <div class="section">
                <h2>Selección de Asteroide</h2>
                <div class="asteroid-list" id="asteroidList"></div>
                <div class="asteroid-details" id="asteroidDetails"></div>
            </div>

            <!-- Columna central: Frame para visualización -->
            <div class="visualization-frame" id="visualizationFrame">
                [Espacio reservado para visualización]
            </div>

            <!-- Columna derecha: Parámetros -->
            <div class="section">
                <h2>Parámetros de Misión</h2>
                <div class="input-group">
                    <label for="warningTime">Tiempo de Advertencia (años)</label>
                    <input type="number" id="warningTime" value="10" min="1" max="50" step="0.1">
                </div>
                <div class="input-group">
                    <label for="distance">Distancia al Impacto (UA)</label>
                    <input type="number" id="distance" value="1.5" min="0.1" max="5" step="0.1">
                </div>
                <button class="calculate-btn" onclick="calculateAllStrategies()">
                    Calcular Estrategias
                </button>
            </div>
        </div>

        <!-- Sección de resultados debajo -->
        <div class="results-section">
            <h2>Estrategias de Mitigación</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </div>

    <script src="/js/Mitigación.js"></script>
</body>
</html>
